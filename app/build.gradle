plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion "30.0.3"

//    configurations {
//        cleanedAnnotations
//        implementation.exclude group: 'org.jetbrains' , module:'annotations'
//        implementation.exclude group: 'com.intellij' , module:'annotations'
//    }
    buildFeatures {
        viewBinding = true
    }

    buildFeatures {
        dataBinding = true
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }

    defaultConfig {
        applicationId "com.soul.gpstest"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        multiDexEnabled true // 启用多DEX

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding true
//        aidl true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
//    buildFeatures { compose = true }
//    composeOptions {
//        kotlinCompilerExtensionVersion = "1.5.0"
//    }
//    compileOptions {
//        sourceCompatibility JavaVersion.VERSION_1_8
//        targetCompatibility JavaVersion.VERSION_1_8
//    }
//    kotlinOptions {
//        jvmTarget = '1.8'
//    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { // 如果使用Kotlin
        jvmTarget = '11'
    }
}

task createCoroutineExceptionHandlerServiceFile {
    doLast {
        // 定义服务文件所在目录
        def serviceDir = new File("$projectDir/src/main/resources/META-INF/services")
        // 创建目录（如果不存在）
        serviceDir.mkdirs()
        // 定义服务文件
        def serviceFile = new File(serviceDir, "kotlinx.coroutines.CoroutineExceptionHandler")
        // 写入全局异常处理器全类名
        serviceFile.text = "com.example.MyGlobalCoroutineExceptionHandler"
    }
}

// 让 assemble 任务依赖于创建文件的任务
assemble.dependsOn createCoroutineExceptionHandlerServiceFile

