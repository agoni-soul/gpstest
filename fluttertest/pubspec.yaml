name: fluttertest
description: "A new Flutter module project."

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
#
# This version is used _only_ for the Runner app, which is used if you just do
# a `flutter run`. It has no impact on any other native host app that you embed
# your Flutter project into.
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  # 提供Material/Cupertino组件的预翻译，提供国际化组件和基础逻辑
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2 # 建议使用最新稳定版
  logger: ^1.4.0
  # 高级日志记录和错误处理包
  talker_flutter: ^5.1.9 # 请检查并更新到最新版本
  talker: ^5.1.9
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # 推荐使用官方最新稳定版[citation:1]
  flutter_spinkit: ^5.2.2
  # 数据库提供者
  sqflite: ^2.0.0+4
  path: ^1.8.0
  path_provider: ^2.1.0
  # 主要注解包
  json_annotation: 4.10.0
  # GraphQL代理
  graphql_flutter: ^5.1.0
  # Dio网络库
  dio: ^5.0.0
  http: ^1.6.0
  # 存储数据库
  shared_preferences: ^2.0.6
  # Redux 相关库
  flutter_redux: ^0.8.2
  # toast弹窗
  fluttertoast: ^8.2.10
  # 用于获取应用包信息的库
  package_info_plus: ^9.0.0
  # 状态管理之Riverpod
  flutter_riverpod: ^3.2.0
  riverpod_annotation: ^4.0.1
  # 处理矢量图形的标准解决方案
  flutter_svg: 2.1.0
  # 处理复杂异步数据流的库
  rxdart: 0.27.1
  # 启动Android原生意图（Intent）的插件
  android_intent_plus: 5.1.0
  # 动画工具包，提供预构建的高质量动画效果和简化复杂动画
  simple_animations: 5.2.0
  animations: 2.1.1
  # 渲染 Adobe After Effects 动画
  lottie: 3.3.2
  # 自动调整文本的字体大小，以确保文本内容能够完美地适应其容器的边界
  auto_size_text: 3.0.0
  # 基于 InheritedWidget 构建，提供了更简洁、更灵活的状态管理解决方案
  provider: 6.1.5+1
  # 实现下拉刷新和上拉加载更多功能的插件
  easy_refresh: ^3.4.0
  # flutter_markdown 已停止维护，使用 flutter_markdown_plus 替代
  # 一个Markdown渲染器，支持文本样式、表格、链接等功能
  flutter_markdown_plus: 1.0.6
  # 通过为 Dart 基础类型（如 String、List、int）和 Flutter 特有类型（如 Color、Duration）添加大量便捷的扩展方法
  supercharged: 2.1.1
  # 用一种高效、自动且精细的方式来管理和响应应用状态的变化
  signals: 6.3.0
  # 用于获取设备硬件和操作系统信息的官方Flutter插件
  device_info_plus: 10.1.2
  # 完整的 Cookie 管理功能
  webview_flutter: ^4.10.0
  # 高版本目前和👆兼容有问题
  flutter_inappwebview: 6.1.5
  # 权限管理
  permission_handler: ^11.0.0
  # 处理 URL 和 URI 链接的核心工具
  url_launcher: ^6.2.1

  # TODO 以下暂时没有查看库的作用
  share_plus: 12.0.1
  pub_semver: 2.1.4
  flutter_slidable: 3.1.2
  #bezier: ^1.1.5
  flare_flutter:
    git:
      url: https://gitee.com/CarGuo/Flare-Flutter.git
      ref: d9c4ca55cbea3f283491679847ff1e9b4bc74192
      path: flare_flutter/

  rive: 0.13.13
  graphql: 5.2.2
  #flutter_cache_manager: 3.0.0-nullsafety.0
  connectivity_plus: 6.0.5
  google_fonts: 6.2.1
  built_value: 8.12.0
  photo_view: 0.15.0
  #    git:
  #      url: https://github.com/CarSmallGuo/photo_view.git
  #      ref: master

  redux: any
  webview_flutter_android: any
  webview_flutter_wkwebview: any
  string_scanner: any
  meta: any
  talker_dio_logger: 5.1.9


dependency_overrides:
  web_socket_channel: ^3.0.1
  matcher: ^0.12.17
  test_api: ^0.7.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 代码生成工具
  build_runner: ^2.4.0
  # 代码生成器
  json_serializable: ^6.12.0
  # Riverpod生成工具
  riverpod_generator: ^4.0.2
  # built_value 库的核心代码生成器，主要用于自动生成不可变值类型（Value Types）的样板代码
  built_value_generator: ^8.12.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  # 针对多语言 l10n
  generate: true
  # 以下是可选的配置项，用于指定生成的l10n类名和位置
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # This section identifies your Flutter project as a module meant for
  # embedding in a native host app.  These identifiers should _not_ ordinarily
  # be changed after generation - they are used to ensure that the tooling can
  # maintain consistency when adding or modifying assets and plugins.
  # They also do not have any bearing on your native host application's
  # identifiers, which may be completely independent or the same as these.
  module:
    androidX: true
    androidPackage: com.haha.fluttertest
    iosBundleIdentifier: com.haha.fluttertest
