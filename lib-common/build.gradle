plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
}

android {
    namespace 'com.haha.common'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility rootProject.ext.sourceCompatibility_javaVersion
        targetCompatibility rootProject.ext.targetCompatibility_javaVersion
    }
    kotlinOptions {
        jvmTarget = rootProject.ext.jvmTarget_version
    }
}

dependencies {
    api "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    api 'androidx.appcompat:appcompat:1.1.0'
    api 'com.google.android.material:material:1.1.0'
    api 'androidx.core:core-ktx:1.10.0'
    api 'androidx.activity:activity-ktx:1.5.0'
    api 'androidx.fragment:fragment-ktx:1.4.1'
    api "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.0"
    api "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    api 'io.reactivex.rxjava2:rxjava:2.2.20'
    api project(':DOFLog')
}
